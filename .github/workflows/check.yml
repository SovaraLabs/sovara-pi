name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: sovara-pi
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - name: Check
        working-directory: sovara-pi/typescript
        run: npm ci && npm run check
